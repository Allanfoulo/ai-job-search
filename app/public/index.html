<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <title>Application Workspace</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="Application Workspace home">
        <span class="brand-mark">A</span><span><strong>Northstar</strong><small>APPLICATION WORKSPACE</small></span>
      </a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span> Overview</button>
        <button class="nav-item" data-view="applications"><span class="nav-icon">▤</span> Applications <span class="nav-count" id="nav-count">0</span></button>
        <button class="nav-item" data-view="profile"><span class="nav-icon">◎</span> Candidate profile</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">✳</div><strong>A little more focused.</strong><p>Keep every application grounded in your real experience.</p><button data-view="profile" class="text-action">Review your profile <span>↗</span></button></div>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span> Settings</button>
        <div class="profile-chip"><div class="avatar">C</div><div><strong>Candidate</strong><small>Personal workspace</small></div><span class="chip-menu">···</span></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="breadcrumbs"><span>Workspace</span><span class="crumb-sep">/</span><strong id="crumb-current">Overview</strong></div><div class="topbar-actions"><span class="local-indicator"><i></i> Saved locally</span><button class="icon-button" aria-label="Notifications">♧</button><div class="avatar small">C</div></div></header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="confirm-dialog" class="modal"><form method="dialog"><button class="modal-close" aria-label="Close">×</button><div id="modal-content"></div></form></dialog>
</body>
</html>
